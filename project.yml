name: FitCamXtra

options:
  bundleIdPrefix: nl.remkoweijnen
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  FitCamXtra:
    type: application
    platform: iOS
    sources:
      - path: FitCamXtra
        excludes:
          - "Resources/Info.plist"
    info:
      path: FitCamXtra/Resources/Info.plist
      properties:
        CFBundleDisplayName: FitCamXtra
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: >-
          FitCamXtra looks for your dashcam on the local network. Nothing leaves the car.
        NSPhotoLibraryAddUsageDescription: >-
          FitCamXtra saves the clips and snapshots you choose to your photo library.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.remkoweijnen.fitcamxtra
        PRODUCT_NAME: FitCamXtra
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
