name: iOS build

on:
  push:
    branches: [main]
    paths:
      - "FitCamXtra/**"
      - "project.yml"
      - "TestFlight/**"
      - "scripts/testflight_notes.py"
      - ".github/workflows/ios-build.yml"
  pull_request:
    paths:
      - "FitCamXtra/**"
      - "project.yml"
      - "TestFlight/**"
      - "scripts/testflight_notes.py"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:
    inputs:
      testflight:
        description: "Also upload this build to TestFlight"
        type: boolean
        default: false

env:
  SCHEME: FitCamXtra
  PROJECT: FitCamXtra.xcodeproj
  CONFIGURATION: Release
  ARCHIVE_PATH: ${{ github.workspace }}/build/FitCamXtra.xcarchive
  EXPORT_PATH: ${{ github.workspace }}/build/export

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Archive and export
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # App Store Connect rejects anything built with an SDK older than iOS 26,
      # and the image default is not always the newest Xcode, so pick the
      # highest version installed and fail early if it is too old.
      - name: Select Xcode
        run: |
          set -euo pipefail
          echo "Installed Xcodes:"
          ls -d /Applications/Xcode*.app

          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null \
            | sed 's#.*/Xcode_##; s#\.app$##' | sort -V | tail -1 || true)
          if [ -n "$LATEST" ]; then
            sudo xcode-select -s "/Applications/Xcode_${LATEST}.app"
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi

          xcodebuild -version
          SDK=$(xcodebuild -showsdks | sed -n 's/.*-sdk iphoneos\([0-9][0-9.]*\).*/\1/p' | sort -V | tail -1)
          echo "iOS SDK: $SDK"
          MAJOR=${SDK%%.*}
          if [ "$MAJOR" -lt 26 ]; then
            echo "::error::iOS SDK $SDK is too old. App Store Connect requires 26 or newer."
            exit 1
          fi

      - name: Install tools
        run: brew install xcodegen xcbeautify

      # The Xcode project is generated from project.yml rather than committed,
      # so it can be maintained from a machine without Xcode.
      - name: Generate the Xcode project
        run: xcodegen generate --spec project.yml

      # A pull request from a fork cannot read secrets. Build unsigned there so
      # the compile is still checked, and sign only when the secrets exist.
      - name: Decide whether we can sign
        id: signing
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
        run: |
          if [ -n "$CERT" ]; then
            echo "can_sign=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Signing secrets are not available; building unsigned."
            echo "can_sign=false" >> "$GITHUB_OUTPUT"
          fi

      # An ad-hoc profile is optional. With one, every build also leaves an
      # IPA that installs straight onto the registered devices, which takes
      # App Store Connect's processing time and its daily upload limit out of
      # the loop when the point is just to try something in the car.
      - name: Decide whether we can export ad-hoc
        id: adhoc
        env:
          PROFILE: ${{ secrets.APPLE_ADHOC_PROFILE_BASE64 }}
        run: |
          if [ -n "$PROFILE" ]; then
            echo "can_export=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No ad-hoc profile; skipping the directly installable build."
            echo "can_export=false" >> "$GITHUB_OUTPUT"
          fi

      # TestFlight is now on request rather than on every push. Apple limits
      # uploads per day and takes minutes to process each one, and the ad-hoc
      # IPA above is what a normal change gets tried with. Run the workflow by
      # hand with "Also upload this build to TestFlight" ticked when a build is
      # meant for testers.
      - name: Decide whether we can upload to TestFlight
        id: testflight
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}
          REQUESTED: ${{ inputs.testflight }}
        run: |
          if [ "$REQUESTED" != "true" ]; then
            echo "::notice::TestFlight upload not requested for this run."
            echo "can_upload=false" >> "$GITHUB_OUTPUT"
          elif [ -n "$KEY_ID" ] && [ -n "$ISSUER_ID" ] && [ -n "$KEY_P8" ]; then
            echo "can_upload=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::TestFlight was requested but the App Store Connect key is missing."
            exit 1
          fi

      - name: Build unsigned
        if: steps.signing.outputs.can_sign == 'false'
        run: |
          set -euo pipefail
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      - name: Install signing material
        if: steps.signing.outputs.can_sign == 'true'
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          APPLE_ADHOC_PROFILE_BASE64: ${{ secrets.APPLE_ADHOC_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"

          echo -n "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode -o "$CERT_PATH"
          echo -n "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode -o "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p "$PROFILES_DIR"
          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"
          UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$RUNNER_TEMP/profile.plist")
          cp "$PROFILE_PATH" "$PROFILES_DIR/$UUID.mobileprovision"
          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"

          # The ad-hoc profile is a second profile over the same app id and
          # the same distribution certificate; only the devices differ.
          if [ -n "${APPLE_ADHOC_PROFILE_BASE64:-}" ]; then
            ADHOC_PATH="$RUNNER_TEMP/adhoc.mobileprovision"
            echo -n "$APPLE_ADHOC_PROFILE_BASE64" | base64 --decode -o "$ADHOC_PATH"
            security cms -D -i "$ADHOC_PATH" > "$RUNNER_TEMP/adhoc.plist"
            ADHOC_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$RUNNER_TEMP/adhoc.plist")
            cp "$ADHOC_PATH" "$PROFILES_DIR/$ADHOC_UUID.mobileprovision"
            echo "ADHOC_PROFILE_UUID=$ADHOC_UUID" >> "$GITHUB_ENV"
            echo "Ad-hoc profile installed: $ADHOC_UUID"
          fi

      - name: Archive
        if: steps.signing.outputs.can_sign == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            | xcbeautify --renderer github-actions

      - name: Export IPA
        if: steps.signing.outputs.can_sign == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUNDLE_ID: nl.remkoweijnen.fitcamxtra
        run: |
          set -euo pipefail
          # Manual signing means the export has to be told which profile backs
          # the bundle id; without the mapping it refuses with exit 70.
          cat > "$RUNNER_TEMP/ExportOptions.plist" << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key><string>$PROFILE_UUID</string>
            </dict>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            | xcbeautify --renderer github-actions

      # Same archive, exported again for the devices in the ad-hoc profile.
      # `release-testing` is what Xcode 15 and later call ad-hoc.
      - name: Export an installable IPA
        if: >-
          steps.signing.outputs.can_sign == 'true' &&
          steps.adhoc.outputs.can_export == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUNDLE_ID: nl.remkoweijnen.fitcamxtra
          ADHOC_EXPORT_PATH: ${{ github.workspace }}/build/adhoc
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/AdHocExportOptions.plist" << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>release-testing</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key><string>$ADHOC_PROFILE_UUID</string>
            </dict>
            <key>compileBitcode</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$ADHOC_EXPORT_PATH" \
            -exportOptionsPlist "$RUNNER_TEMP/AdHocExportOptions.plist" \
            | xcbeautify --renderer github-actions

      - name: Upload the installable IPA
        if: >-
          steps.signing.outputs.can_sign == 'true' &&
          steps.adhoc.outputs.can_export == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: FitCamXtra-adhoc-ipa
          path: ${{ github.workspace }}/build/adhoc/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload IPA
        if: steps.signing.outputs.can_sign == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: FitCamXtra-ipa
          path: ${{ env.EXPORT_PATH }}/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload to TestFlight
        if: >-
          steps.signing.outputs.can_sign == 'true' &&
          steps.testflight.outputs.can_upload == 'true'
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          # altool looks for the key by this exact name in this exact directory.
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          echo -n "$KEY_P8" | base64 --decode -o "$KEY_DIR/AuthKey_${KEY_ID}.p8"

          IPA=$(find "$EXPORT_PATH" -name "*.ipa" -maxdepth 1 | head -1)
          echo "Uploading $IPA"
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"

      # altool uploads the binary and nothing else. The notes testers read come
      # from the App Store Connect API, so they are sent separately once Apple
      # has processed the build.
      - name: Attach the What to Test notes
        if: >-
          steps.signing.outputs.can_sign == 'true' &&
          steps.testflight.outputs.can_upload == 'true'
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          BUNDLE_ID: nl.remkoweijnen.fitcamxtra
          BUILD_NUMBER: ${{ github.run_number }}
          NOTES_PATH: TestFlight/WhatToTest.en-US.txt
          TIMEOUT_SECONDS: "1800"
        run: |
          set -euo pipefail
          # The runner's python is Homebrew's and refuses to install into
          # itself (PEP 668), so the two dependencies go in a throwaway venv.
          VENV="$RUNNER_TEMP/testflight-venv"
          python3 -m venv "$VENV"
          "$VENV/bin/pip" install --quiet --disable-pip-version-check pyjwt cryptography
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          export APP_STORE_CONNECT_KEY_PATH="$KEY_DIR/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          "$VENV/bin/python" scripts/testflight_notes.py

      - name: Remove the App Store Connect key
        if: always()
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: rm -rf "$HOME/.appstoreconnect"

      - name: Remove temporary keychain
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/build.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/build.keychain-db"
          fi
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/profile.plist"
